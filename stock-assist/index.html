<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>株売買支援</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e5e7eb;
    --buy: #d93a3a; --buy-bg: #fdecec; --sell: #2563eb; --sell-bg: #e8effd;
    --hold: #6b7280; --hold-bg: #f0f1f3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --card: #1b1f27; --text: #e6e8ec; --muted: #9aa1ad; --line: #2c323d;
      --buy: #f06262; --buy-bg: #3a1f22; --sell: #6b9cff; --sell-bg: #1d2a45;
      --hold: #9aa1ad; --hold-bg: #262b35;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151b; --card: #1b1f27; --text: #e6e8ec; --muted: #9aa1ad; --line: #2c323d;
    --buy: #f06262; --buy-bg: #3a1f22; --sell: #6b9cff; --sell-bg: #1d2a45;
    --hold: #9aa1ad; --hold-bg: #262b35;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  header { padding: 16px; max-width: 960px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .note { color: var(--muted); font-size: 13px; margin: 0; }
  main { max-width: 960px; margin: 0 auto; padding: 0 16px 32px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px;
    display: flex; flex-direction: column; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .name { font-weight: 600; }
  .code { color: var(--muted); font-size: 12px; }
  .price { font-size: 22px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .chg { font-size: 13px; font-variant-numeric: tabular-nums; }
  .up { color: var(--buy); } .down { color: var(--sell); }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .s-buy { color: var(--buy); background: var(--buy-bg); }
  .s-sell { color: var(--sell); background: var(--sell-bg); }
  .s-hold { color: var(--hold); background: var(--hold-bg); }
  svg.spark { width: 100%; height: 48px; display: block; margin: 8px 0; }
  ul.reasons { margin: 6px 0 10px; padding-left: 18px; font-size: 13px; color: var(--muted); }
  ul.reasons li.hit { color: var(--text); }
  .actions { display: flex; gap: 8px; align-items: center; margin-top: auto; }
  .actions input { width: 72px; padding: 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--card); color: var(--text); font-size: 14px; }
  button { flex: 1; padding: 10px; border: 0; border-radius: 8px; font-size: 15px; font-weight: 700;
    color: #fff; cursor: pointer; }
  button.buy { background: var(--buy); } button.sell { background: var(--sell); }
  button:active { transform: translateY(1px); }
  h2 { font-size: 16px; margin: 24px 0 8px; }
  .tbl-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { padding: 16px; color: var(--muted); font-size: 13px; }
  .link-btn { background: none; color: var(--muted); border: 1px solid var(--line); flex: none;
    font-size: 12px; font-weight: 400; padding: 4px 10px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text);
    color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>株売買支援（試作）</h1>
  <p class="note">価格はダミーデータです。ボタンを押すと売買記録をこのブラウザに保存するだけで、実際の発注はしません。</p>
</header>
<main>
  <div class="grid" id="cards"></div>
  <div class="row"><h2>売買記録</h2><button class="link-btn" id="clear">記録を消去</button></div>
  <div class="tbl-wrap" id="log"></div>
</main>
<div class="toast" id="toast"></div>

<script>
const STOCKS = [
  { code: "7203", name: "トヨタ自動車", base: 2800, seed: 11 },
  { code: "6758", name: "ソニーグループ", base: 3300, seed: 23 },
  { code: "9984", name: "ソフトバンクG", base: 9000, seed: 37 },
  { code: "8306", name: "三菱UFJ", base: 1700, seed: 41 },
  { code: "6861", name: "キーエンス", base: 62000, seed: 53 },
  { code: "9432", name: "NTT", base: 160, seed: 67 },
];
const LOG_KEY = "stock-assist-log";

// 銘柄ごとに再現可能なダミー終値（60営業日）
function genPrices(base, seed) {
  let s = seed;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const out = [base]; let drift = 0;
  for (let i = 1; i < 60; i++) {
    if (i % 15 === 0) drift = (rnd() - 0.5) * 0.012;
    out.push(out[i - 1] * (1 + drift + (rnd() - 0.5) * 0.03));
  }
  return out.map(p => Math.round(p * 10) / 10);
}
const sma = (a, n, i = a.length - 1) => a.slice(i - n + 1, i + 1).reduce((x, y) => x + y, 0) / n;
function rsi(a, n = 14) {
  let g = 0, l = 0;
  for (let i = a.length - n; i < a.length; i++) {
    const d = a[i] - a[i - 1]; d > 0 ? (g += d) : (l -= d);
  }
  return l === 0 ? 100 : 100 - 100 / (1 + g / l);
}

// シグナル判定ルール
function judge(p) {
  const last = p.length - 1;
  const s5 = sma(p, 5), s25 = sma(p, 25), r = rsi(p);
  let cross = null;
  for (let i = last; i > last - 3; i--) {
    const a = sma(p, 5, i) - sma(p, 25, i), b = sma(p, 5, i - 1) - sma(p, 25, i - 1);
    if (a > 0 && b <= 0) { cross = "golden"; break; }
    if (a < 0 && b >= 0) { cross = "dead"; break; }
  }
  const rules = [
    { side: "buy",  hit: cross === "golden", text: "直近3日以内にゴールデンクロス（5日線が25日線を上抜け）" },
    { side: "buy",  hit: r < 30,             text: `RSI(14) が30未満で売られすぎ（現在 ${r.toFixed(1)}）` },
    { side: "sell", hit: cross === "dead",   text: "直近3日以内にデッドクロス（5日線が25日線を下抜け）" },
    { side: "sell", hit: r > 70,             text: `RSI(14) が70超で買われすぎ（現在 ${r.toFixed(1)}）` },
  ];
  const buy = rules.filter(x => x.side === "buy" && x.hit).length;
  const sell = rules.filter(x => x.side === "sell" && x.hit).length;
  const signal = buy > sell ? "buy" : sell > buy ? "sell" : "hold";
  const trend = `5日線 ${s5.toFixed(1)} / 25日線 ${s25.toFixed(1)}（${s5 > s25 ? "上昇" : "下落"}基調）`;
  return { signal, rules, trend };
}

const LABEL = { buy: "買い", sell: "売り", hold: "様子見" };
const yen = v => v.toLocaleString("ja-JP", { maximumFractionDigits: 1 });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function spark(p) {
  const min = Math.min(...p), max = Math.max(...p), w = 300, h = 48;
  const pts = p.map((v, i) => `${(i / (p.length - 1)) * w},${h - 2 - ((v - min) / (max - min || 1)) * (h - 4)}`).join(" ");
  const col = p[p.length - 1] >= p[0] ? "var(--buy)" : "var(--sell)";
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="${col}" stroke-width="1.5" points="${pts}"/></svg>`;
}

const data = STOCKS.map(s => {
  const prices = genPrices(s.base, s.seed);
  return { ...s, prices, price: prices.at(-1), prev: prices.at(-2), ...judge(prices) };
});

function renderCards() {
  document.getElementById("cards").innerHTML = data.map((d, idx) => {
    const chg = d.price - d.prev, pct = (chg / d.prev) * 100;
    const hits = d.rules.filter(r => r.hit);
    const reasons = hits.length
      ? hits.map(r => `<li class="hit">${esc(r.text)}</li>`).join("")
      : `<li>該当する売買ルールなし</li>`;
    return `<div class="card">
      <div class="row"><div><span class="name">${esc(d.name)}</span> <span class="code">${d.code}</span></div>
        <span class="badge s-${d.signal}">${LABEL[d.signal]}</span></div>
      <div class="row"><span class="price">¥${yen(d.price)}</span>
        <span class="chg ${chg >= 0 ? "up" : "down"}">${chg >= 0 ? "+" : ""}${yen(chg)} (${pct.toFixed(2)}%)</span></div>
      ${spark(d.prices)}
      <ul class="reasons">${reasons}<li>${esc(d.trend)}</li></ul>
      <div class="actions">
        <input type="number" min="1" step="1" value="100" aria-label="株数" id="qty-${idx}">
        <button class="buy" data-i="${idx}" data-side="buy">買い</button>
        <button class="sell" data-i="${idx}" data-side="sell">売り</button>
      </div></div>`;
  }).join("");
}

function loadLog() { try { return JSON.parse(localStorage.getItem(LOG_KEY)) || []; } catch { return []; } }
function saveLog(log) { try { localStorage.setItem(LOG_KEY, JSON.stringify(log)); } catch {} }

function renderLog() {
  const log = loadLog();
  const el = document.getElementById("log");
  if (!log.length) { el.innerHTML = `<div class="empty">まだ記録はありません。</div>`; return; }
  el.innerHTML = `<table><thead><tr><th>日時</th><th>銘柄</th><th>売買</th><th>株数</th><th>価格</th><th>金額</th><th>その時のシグナル</th></tr></thead><tbody>${
    log.slice().reverse().map(r => `<tr>
      <td>${new Date(r.at).toLocaleString("ja-JP")}</td>
      <td>${esc(r.name)} ${r.code}</td>
      <td><span class="badge s-${r.side}">${LABEL[r.side]}</span></td>
      <td class="num">${r.qty.toLocaleString()}</td>
      <td class="num">¥${yen(r.price)}</td>
      <td class="num">¥${yen(r.price * r.qty)}</td>
      <td><span class="badge s-${r.signal}">${LABEL[r.signal]}</span>${r.side !== r.signal ? ' <span title="シグナルと逆の売買">⚠</span>' : ""}</td>
    </tr>`).join("")}</tbody></table>`;
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 1800);
}

document.getElementById("cards").addEventListener("click", e => {
  const b = e.target.closest("button[data-side]"); if (!b) return;
  const d = data[b.dataset.i], side = b.dataset.side;
  const qty = parseInt(document.getElementById(`qty-${b.dataset.i}`).value, 10);
  if (!(qty > 0)) { toast("株数を入力してください"); return; }
  const log = loadLog();
  log.push({ at: Date.now(), code: d.code, name: d.name, side, qty, price: d.price, signal: d.signal });
  saveLog(log); renderLog();
  toast(`${d.name} を ${qty}株 ${LABEL[side]} として記録しました（発注はしていません）`);
});
document.getElementById("clear").addEventListener("click", () => {
  if (confirm("売買記録をすべて消去しますか？")) { saveLog([]); renderLog(); }
});

renderCards(); renderLog();
</script>
</body>
</html>
