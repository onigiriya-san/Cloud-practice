<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>株売買支援</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e5e7eb;
    --buy: #d93a3a; --buy-bg: #fdecec; --sell: #2563eb; --sell-bg: #e8effd;
    --hold: #6b7280; --hold-bg: #f0f1f3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --card: #1b1f27; --text: #e6e8ec; --muted: #9aa1ad; --line: #2c323d;
      --buy: #f06262; --buy-bg: #3a1f22; --sell: #6b9cff; --sell-bg: #1d2a45;
      --hold: #9aa1ad; --hold-bg: #262b35;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151b; --card: #1b1f27; --text: #e6e8ec; --muted: #9aa1ad; --line: #2c323d;
    --buy: #f06262; --buy-bg: #3a1f22; --sell: #6b9cff; --sell-bg: #1d2a45;
    --hold: #9aa1ad; --hold-bg: #262b35;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  header { padding: 16px; max-width: 960px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .note { color: var(--muted); font-size: 13px; margin: 0; }
  main { max-width: 960px; margin: 0 auto; padding: 0 16px 32px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px;
    display: flex; flex-direction: column; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .name { font-weight: 600; }
  .code { color: var(--muted); font-size: 12px; }
  .price { font-size: 22px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .chg { font-size: 13px; font-variant-numeric: tabular-nums; }
  .up { color: var(--buy); } .down { color: var(--sell); }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .s-buy { color: var(--buy); background: var(--buy-bg); }
  .s-sell { color: var(--sell); background: var(--sell-bg); }
  .s-hold { color: var(--hold); background: var(--hold-bg); }
  .s-shock { color: #b45309; background: #fef3c7; }
  .s-block { color: var(--sell); background: var(--sell-bg); }
  .s-crash { color: #fff; background: var(--buy); }
  .s-warn { color: #b45309; background: #fef3c7; }
  .s-none { color: var(--hold); background: var(--hold-bg); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .s-shock, :root:not([data-theme="light"]) .s-warn { color: #fbbf24; background: #3a2e12; } }
  :root[data-theme="dark"] .s-shock, :root[data-theme="dark"] .s-warn { color: #fbbf24; background: #3a2e12; }
  .market { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .market .stat { font-size: 12px; color: var(--muted); } .market .stat b { display: block; font-size: 16px; color: var(--text); font-variant-numeric: tabular-nums; }
  .market svg.spark { width: 160px; height: 40px; margin: 0; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { flex: none; background: var(--card); color: var(--text); border: 1px solid var(--line); padding: 6px 12px;
    font-size: 13px; font-weight: 500; border-radius: 999px; }
  .chip.on { background: var(--text); color: var(--bg); }
  .meta { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  svg.spark { width: 100%; height: 48px; display: block; margin: 8px 0; }
  ul.reasons { margin: 6px 0 10px; padding-left: 18px; font-size: 13px; color: var(--muted); }
  ul.reasons li.hit { color: var(--text); }
  .actions { display: flex; gap: 8px; align-items: center; margin-top: auto; }
  .actions input { width: 72px; padding: 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--card); color: var(--text); font-size: 14px; }
  button { flex: 1; padding: 10px; border: 0; border-radius: 8px; font-size: 15px; font-weight: 700;
    color: #fff; cursor: pointer; }
  button.buy { background: var(--buy); } button.sell { background: var(--sell); }
  button:active { transform: translateY(1px); }
  h2 { font-size: 16px; margin: 24px 0 8px; }
  .tbl-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { padding: 16px; color: var(--muted); font-size: 13px; }
  .link-btn { background: none; color: var(--muted); border: 1px solid var(--line); flex: none;
    font-size: 12px; font-weight: 400; padding: 4px 10px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text);
    color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>株売買支援（試作）</h1>
  <p class="note" id="asof"></p>
  <p class="note">シグナルは J-Quants 日次CSVの実データから計算した結果です。ボタンを押すと売買記録をこのブラウザに保存するだけで、実際の発注はしません。</p>
</header>
<main>
  <div class="market" id="market"></div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="cards"></div>
  <p class="note" style="margin-top:10px">「買い候補」「売り検討」は財務データ（EDINET）が必要なため未対応です。表示中のシグナルは株価・出来高だけで判定できる3種類です。</p>
  <div class="row"><h2>売買記録</h2><button class="link-btn" id="clear">記録を消去</button></div>
  <div class="tbl-wrap" id="log"></div>
</main>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script>
const D = window.SIGNAL_DATA;
const LOG_KEY = "stock-assist-log-v2";
const SIG = {
  shock: { label: "急落アラート", cls: "s-shock" },
  block: { label: "買い見送り", cls: "s-block" },
  none:  { label: "シグナルなし", cls: "s-none" },
};
const REASON = { volume_surge_at_high: "出来高が急増し、株価が60日高値圏にある（20日平均が120日平均の2倍超、終値が60日高値の95%以上）",
                 limit_up: "ストップ高で張り付いており、買えない可能性が高い" };
const MARKET = {
  crash:   { label: "相場急落（本警報）", cls: "s-crash", msg: "5営業日で−10%以下、売買代金も増加。買い場の候補を確認してください。" },
  warning: { label: "相場急落（注意）", cls: "s-warn", msg: "5営業日で−5%以下。" },
  none:    { label: "平常", cls: "s-none", msg: "相場全体の急落は検知していません。" },
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const yen = v => v == null ? "-" : v.toLocaleString("ja-JP", { maximumFractionDigits: 1 });
const pct = v => v == null ? "-" : (v >= 0 ? "+" : "") + (v * 100).toFixed(2) + "%";

D.stocks.forEach(s => { s.sig = s.shock ? "shock" : s.blocked ? "block" : "none"; });
const sigOf = k => SIG[k];

function spark(p, col) {
  if (p.length < 2) return "";
  const min = Math.min(...p), max = Math.max(...p), w = 300, h = 48;
  const pts = p.map((v, i) => `${(i / (p.length - 1)) * w},${h - 2 - ((v - min) / (max - min || 1)) * (h - 4)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="${col}" stroke-width="1.5" points="${pts}"/></svg>`;
}

function renderMarket() {
  const m = D.market, st = MARKET[m.level || "none"];
  const col = m.line[m.line.length - 1] >= m.line[0] ? "var(--buy)" : "var(--sell)";
  document.getElementById("market").innerHTML =
    `<span class="badge ${st.cls}">${st.label}</span>
     <div class="stat">5営業日の騰落<b class="${m.cum >= 0 ? "up" : "down"}">${pct(m.cum)}</b></div>
     <div class="stat">売買代金（60日平均比）<b>${m.vaRatio.toFixed(2)}倍</b></div>
     <div class="stat">全${D.counts.universe.toLocaleString()}銘柄の時価総額加重<b>直近${m.line.length}日</b></div>
     ${spark(m.line, col)}
     <div class="stat" style="flex-basis:100%">${st.msg}（TOPIXの代わりに全銘柄の時価総額加重で計算）</div>`;
  document.getElementById("asof").textContent =
    `データ: ${D.asOf} 時点（${D.days}営業日分）／ 急落 ${D.counts.shock}件・買い見送り ${D.counts.blocked}件`;
}

let filter = "all";
function renderChips() {
  const items = [["all", "すべて"], ["shock", "急落アラート"], ["block", "買い見送り"], ["none", "シグナルなし"]];
  document.getElementById("chips").innerHTML = items.map(([k, l]) => {
    const n = k === "all" ? D.stocks.length : D.stocks.filter(s => s.sig === k).length;
    return `<button class="chip ${filter === k ? "on" : ""}" data-f="${k}">${l} ${n}</button>`;
  }).join("");
}

function renderCards() {
  const list = D.stocks.map((s, i) => [s, i]).filter(([s]) => filter === "all" || s.sig === filter);
  document.getElementById("cards").innerHTML = list.map(([d, idx]) => {
    const sg = sigOf(d.sig);
    const reasons = [];
    if (d.shock) reasons.push(d.shock_ret <= -0.15 ? `前日比 ${pct(d.shock_ret)}、出来高が20日平均の3倍以上` : `ストップ安（前日比 ${pct(d.shock_ret)}）`);
    if (d.blocked) reasons.push(REASON[d.blocked] || d.blocked);
    if (!reasons.length) reasons.push("株価・出来高では該当なし");
    const cap = d.mktcap == null ? "時価総額 -" : `時価総額 約${Math.round(d.mktcap / 100).toLocaleString()}億円`;
    const col = d.prices[d.prices.length - 1] >= d.prices[0] ? "var(--buy)" : "var(--sell)";
    return `<div class="card">
      <div class="row"><span class="name">${esc(d.code)}</span><span class="badge ${sg.cls}">${sg.label}</span></div>
      <p class="meta">${cap}</p>
      <div class="row"><span class="price">¥${yen(d.price)}</span><span class="chg ${(d.chg || 0) >= 0 ? "up" : "down"}">${pct(d.chg)}</span></div>
      ${spark(d.prices, col)}
      <ul class="reasons">${reasons.map(r => `<li class="hit">${esc(r)}</li>`).join("")}</ul>
      <div class="actions">
        <input type="number" min="1" step="1" value="100" aria-label="株数" id="qty-${idx}">
        <button class="buy" data-i="${idx}" data-side="buy">買い</button>
        <button class="sell" data-i="${idx}" data-side="sell">売り</button>
      </div></div>`;
  }).join("") || `<div class="empty">該当する銘柄はありません。</div>`;
}

function loadLog() { try { return JSON.parse(localStorage.getItem(LOG_KEY)) || []; } catch { return []; } }
function saveLog(log) { try { localStorage.setItem(LOG_KEY, JSON.stringify(log)); } catch {} }

function renderLog() {
  const log = loadLog(), el = document.getElementById("log");
  if (!log.length) { el.innerHTML = `<div class="empty">まだ記録はありません。</div>`; return; }
  el.innerHTML = `<table><thead><tr><th>日時</th><th>銘柄</th><th>売買</th><th>株数</th><th>価格</th><th>金額</th><th>その時のシグナル</th></tr></thead><tbody>${
    log.slice().reverse().map(r => `<tr>
      <td>${new Date(r.at).toLocaleString("ja-JP")}</td>
      <td>${esc(r.code)}</td>
      <td><span class="badge ${r.side === "buy" ? "s-buy" : "s-sell"}">${r.side === "buy" ? "買い" : "売り"}</span></td>
      <td class="num">${r.qty.toLocaleString()}</td>
      <td class="num">¥${yen(r.price)}</td>
      <td class="num">¥${yen(r.price * r.qty)}</td>
      <td><span class="badge ${sigOf(r.sig).cls}">${sigOf(r.sig).label}</span> <span class="note">${esc(r.asOf)}</span></td>
    </tr>`).join("")}</tbody></table>`;
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 2200);
}

document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest("[data-f]"); if (!b) return;
  filter = b.dataset.f; renderChips(); renderCards();
});
document.getElementById("cards").addEventListener("click", e => {
  const b = e.target.closest("button[data-side]"); if (!b) return;
  const d = D.stocks[b.dataset.i], side = b.dataset.side;
  const qty = parseInt(document.getElementById(`qty-${b.dataset.i}`).value, 10);
  if (!(qty > 0)) { toast("株数を入力してください"); return; }
  if (side === "buy" && d.blocked && !confirm(`${d.code} は「買い見送り」です。\n${REASON[d.blocked]}\nそれでも買いを記録しますか？`)) return;
  const log = loadLog();
  log.push({ at: Date.now(), code: d.code, side, qty, price: d.price, sig: d.sig, asOf: D.asOf });
  saveLog(log); renderLog();
  toast(`${d.code} を ${qty}株 ${side === "buy" ? "買い" : "売り"}として記録しました（発注はしていません）`);
});
document.getElementById("clear").addEventListener("click", () => {
  if (confirm("売買記録をすべて消去しますか？")) { saveLog([]); renderLog(); }
});

renderMarket(); renderChips(); renderCards(); renderLog();
</script>
</body>
</html>
